<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tin học ứng dụng | Applied Computing • DC3MO19</title><style>:root{--a:#087d7c;--dark:#10364c;--mut:#5a6e7b;--line:#dce7ec}*{box-sizing:border-box}body{margin:0;font:15px/1.58 system-ui,Segoe UI,Arial,sans-serif;color:#193345;background:#f3f7fa}header{background:linear-gradient(110deg,#0b3c58,#087e76);color:white;padding:22px max(18px,calc((100vw - 1200px)/2))}header h1{font-size:clamp(24px,3vw,35px);margin:5px 0}header p{margin:5px 0}button{font:inherit;border:1px solid #bbd2da;background:white;color:#095968;border-radius:9px;padding:9px 12px;cursor:pointer}button:hover{background:#e6f5f4}button.active,.primary{background:var(--a);color:#fff;border-color:var(--a)}.lang{display:flex;gap:8px;margin-top:14px}.lang button{min-width:110px}.wrap{max-width:1200px;margin:auto;padding:19px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}aside,.panel{background:white;border-radius:16px;border:1px solid var(--line);padding:19px;box-shadow:0 3px 18px #1426380b}aside{align-self:start;position:sticky;top:12px;max-height:95vh;overflow:auto}.nav{display:grid;gap:6px;margin:10px 0}.nav button{text-align:left}.lessonbtn{font-size:13px;text-align:left;padding:8px}.lessonbtn small{display:block;color:var(--mut)}.panel{margin-bottom:16px}.panel h2{margin:0 0 13px;font-size:24px}h3{margin:18px 0 8px}p{margin:7px 0 12px}.mut{color:var(--mut)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.card{background:#f7fbfc;border:1px solid var(--line);padding:13px;border-radius:12px}.card strong{display:block;color:#0b7977;font-size:23px}.tabs,.row{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:12px 0}.note{padding:12px;background:#edf7f6;border-left:4px solid #14948c;border-radius:7px}.warm{background:#fff6e8;border-color:#d79b3a}.teaching{background:#f8fbff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}.teaching p{margin:8px 0}input,select{font:inherit;border:1px solid #b9ced8;padding:8px;border-radius:8px;max-width:100%}input[type=number]{width:120px}label{display:inline-flex;flex-direction:column;gap:4px}fieldset{border:1px solid var(--line);border-radius:10px;margin:11px 0;padding:12px}fieldset label{display:block;padding:5px}fieldset input{margin-right:6px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:500px}td,th{border:1px solid var(--line);padding:8px;text-align:left}th{background:#eaf4f4}canvas{border:1px solid var(--line);border-radius:12px;width:100%;height:280px}.result{padding:12px;background:#eef6f8;border-radius:10px;margin:12px 0}code{background:#edf2f5;border-radius:4px;padding:2px 4px}footer{text-align:center;padding:20px;color:#586f7b;line-height:1.8}.tag{display:inline-block;background:#e2f4f1;color:#126c69;border-radius:22px;padding:3px 10px;font-size:12px;font-weight:700}@media(max-width:800px){.wrap{display:block}aside{position:static;max-height:380px;margin-bottom:15px}.panel{padding:15px}}@media print{aside,.lang,.tabs,button{display:none!important}}</style></head><body><header><span class="tag">DC3MO19 · 3 CREDITS</span><h1 id="brand"></h1><p id="subtitle"></p><p id="school"></p><div class="lang"><button id="viBtn" class="active">VI</button><button id="enBtn">EN</button></div></header><div class="wrap"><aside><b id="navtitle"></b><div class="nav" id="nav"></div><hr><b id="sessionsTitle"></b><div class="nav" id="sessions"></div><p class="mut" id="offline"></p></aside><main id="main"></main></div><footer><strong id="author"></strong><div id="affiliation"></div><small id="disclaimer"></small></footer><script>
const LESSONS={vi:[{"id":1,"module":"Excel","title":"Làm quen Excel, nhập liệu và kiểm soát dữ liệu","clo":"CLO1.1 · CLO2.1","points":["Vai trò của Excel trong quản lý dữ liệu không khí, nước, đất và khí thải.","Phân biệt dữ liệu số, văn bản, ngày tháng, đơn vị và giá trị thiếu.","Data → Sort/Filter giúp tìm các mẫu bất thường; Data Validation kiểm soát dữ liệu đầu vào."],"practice":["Tạo bảng gồm Mã mẫu, Ngày đo, pH, DO (mg/L), COD (mg/L).","Nhập 10 mẫu; dùng Filter để tìm COD > 50 mg/L.","Đặt Data Validation cho pH trong khoảng 0–14."],"q":{"prompt":"Trong bảng quan trắc, tính năng nào giúp giới hạn giá trị pH nhập vào?","options":["Data Validation","Merge Cells","Page Layout","Freeze Panes"],"answer":0,"why":"Data Validation giúp đặt quy tắc nhập dữ liệu, ví dụ giá trị pH từ 0 đến 14."},"extras":[{"prompt":"Hàm nào trả về trung vị?","options":["MEDIAN","MODE","SUM","COUNT"],"answer":0,"why":"MEDIAN xác định trung vị."}],"teaching":["Excel tổ chức dữ liệu theo hàng (bản ghi) và cột (biến). Mỗi hàng nên tương ứng một mẫu quan trắc, mỗi cột chỉ chứa một loại thông tin và đơn vị thống nhất.","Ví dụ: bảng Mã mẫu | Ngày | pH | COD (mg/L); dùng Data → Filter để tìm mẫu có COD > 50 mg/L. Data Validation → Decimal → between 0 and 14 để kiểm soát pH.","Lưu ý: ô trống, số 0 và dữ liệu dưới giới hạn phát hiện mang ý nghĩa khác nhau; không tự ý thay thế."]},{"id":2,"module":"Excel","title":"Hàm thống kê, toán học và điều kiện","clo":"CLO1.1 · CLO2.1","points":["AVERAGE, MEDIAN, MODE, MIN, MAX, COUNT, COUNTA dùng thống kê mô tả.","SUM, PRODUCT, SQRT, LOG thực hiện phép tính số học.","IF, IFERROR, COUNTIF, SUMIF giúp phân loại và tổng hợp có điều kiện."],"practice":["Dùng AVERAGE tính COD trung bình cho 10 mẫu.","Dùng IF phân loại COD vượt ngưỡng giả định 50 mg/L.","Dùng COUNTIF đếm số mẫu vượt ngưỡng và IFERROR xử lý chia cho 0."],"q":{"prompt":"Công thức nào đếm số giá trị lớn hơn 50 trong C2:C11?","options":["=COUNTIF(C2:C11,\">50\")","=SUM(C2:C11)","=AVERAGE(C2:C11)","=IF(C2>50,1,0)"],"answer":0,"why":"COUNTIF(range,criteria) đếm ô thỏa điều kiện."},"extras":[{"prompt":"Hàm nào tìm giá trị lớn nhất?","options":["MAX","MIN","AVERAGE","LEFT"],"answer":0,"why":"MAX trả về giá trị lớn nhất."}],"teaching":["Nhóm thống kê: AVERAGE (trung bình), MEDIAN (trung vị), MODE (giá trị phổ biến), MIN, MAX, COUNT (đếm số), COUNTA (đếm ô không trống). Nhóm toán học: SUM, PRODUCT, SQRT, LOG.","Ví dụ: =AVERAGE(C2:C11) tính COD trung bình; =IF(C2>50,\"Vượt\",\"Đạt\") phân loại theo ngưỡng minh họa; =COUNTIF(C2:C11,\">50\") đếm mẫu vượt ngưỡng.","IFERROR(x,\"Lỗi dữ liệu\") giúp xử lý lỗi có kiểm soát; phải kiểm tra nguyên nhân chứ không che giấu lỗi nguồn."]},{"id":3,"module":"Excel","title":"Hàm chuỗi, tra cứu và hồi quy","clo":"CLO1.1 · CLO2.1","points":["LEFT, RIGHT, MID, CONCATENATE, TRIM hỗ trợ chuẩn hóa mã mẫu.","VLOOKUP, HLOOKUP, INDEX, MATCH hỗ trợ tra cứu bảng danh mục.","Regression Analysis thuộc Data Analysis ToolPak, dùng phân tích xu hướng và quan hệ biến."],"practice":["Tách mã trạm từ chuỗi “HN-WS-001” bằng LEFT hoặc MID.","Lập bảng mã trạm và tra tên bằng VLOOKUP hoặc INDEX/MATCH.","Thực hiện hồi quy đơn giữa thời gian và COD bằng Regression Analysis."],"q":{"prompt":"Hàm nào thường dùng để loại bỏ khoảng trắng thừa trong chuỗi?","options":["TRIM","MAX","SQRT","COUNT"],"answer":0,"why":"TRIM loại bỏ các khoảng trắng thừa (trừ khoảng cách đơn giữa các từ)."},"extras":[{"prompt":"Hàm nào nối chuỗi trong Excel theo đề cương?","options":["CONCATENATE","COUNTIF","SQRT","SUMIF"],"answer":0,"why":"CONCATENATE ghép chuỗi."}],"teaching":["LEFT(text,n), RIGHT(text,n), MID(text,start,n) tách mã mẫu; TRIM loại bỏ khoảng trắng thừa; CONCATENATE nối các trường thông tin.","VLOOKUP tìm theo cột đầu của bảng; INDEX kết hợp MATCH linh hoạt hơn. Ví dụ: =VLOOKUP(A2,$F$2:$G$20,2,FALSE). Dấu $ giữ cố định bảng tra cứu.","Hồi quy đơn có dạng y=a+bx; dùng Data → Data Analysis → Regression, xem hệ số b, R² và phần dư. Tương quan không tự chứng minh quan hệ nhân quả."]},{"id":4,"module":"Excel","title":"Biểu đồ và PivotTable cho số liệu môi trường","clo":"CLO1.1 · CLO2.1","points":["Biểu đồ đường thể hiện biến động theo thời gian; biểu đồ cột so sánh các nhóm.","Biểu đồ tròn mô tả cơ cấu khi các phần tạo thành tổng hợp lý.","PivotTable tổng hợp theo tháng, trạm, chất ô nhiễm hoặc vùng."],"practice":["Tạo biểu đồ đường cho COD theo tháng.","Tạo PivotTable tính COD trung bình theo trạm và tháng.","Đặt tiêu đề, đơn vị trục, chú giải và chú thích nguồn dữ liệu."],"q":{"prompt":"Biểu đồ nào thường phù hợp nhất cho biến động COD theo 12 tháng?","options":["Đường","Tròn","Radar","Bong bóng"],"answer":0,"why":"Đường diễn tả xu hướng theo thời gian."},"extras":[{"prompt":"Công cụ nào tổng hợp dữ liệu theo nhóm?","options":["PivotTable","Data Validation","Zoom","Offset"],"answer":0,"why":"PivotTable tổng hợp các trường dữ liệu."}],"teaching":["Biểu đồ đường phù hợp chuỗi thời gian; biểu đồ cột so sánh địa điểm; biểu đồ tròn chỉ nên dùng khi các phần tạo nên một tổng có ý nghĩa.","Ví dụ: chọn Ngày và COD → Insert → Line Chart → đặt nhãn trục 'COD (mg/L)'. PivotTable: Rows = Trạm, Columns = Tháng, Values = Average of COD.","Cần hiển thị đơn vị, thời gian, nguồn dữ liệu và tránh nối liền các khoảng thời gian thiếu mẫu mà không chú thích."]},{"id":5,"module":"AutoCAD","title":"Nguyên tắc bản vẽ, giao diện, đơn vị và tọa độ","clo":"CLO1.2 · CLO2.2","points":["Nhận biết sơ đồ công nghệ, mặt bằng, cao trình và bản vẽ chi tiết thiết bị.","Thiết lập UNITS, hệ tọa độ, vùng vẽ, tỷ lệ và cách tổ chức đối tượng.","Phân biệt Model Space và Layout (Paper Space)."],"practice":["Thiết lập đơn vị mm cho bản vẽ bể xử lý.","Xác định gốc tọa độ và vẽ khung khu vực 6000 × 4000 mm.","Phân tích bố cục một sơ đồ công nghệ xử lý nước thải."],"q":{"prompt":"Lệnh nào dùng thiết lập đơn vị bản vẽ?","options":["UNITS","TRIM","PAN","HATCH"],"answer":0,"why":"UNITS cấu hình kiểu và độ chính xác đơn vị của bản vẽ."},"extras":[{"prompt":"Lệnh vẽ hình chữ nhật trong AutoCAD?","options":["RECTANGLE","CIRCLE","PAN","OFFSET"],"answer":0,"why":"RECTANGLE vẽ hình chữ nhật."}],"teaching":["AutoCAD có Model Space để dựng hình kích thước thực và Layout để bố trí tờ in. Dùng lệnh UNITS để thiết lập đơn vị; đặt tỷ lệ hiển thị khi in, không thay đổi kích thước thực của đối tượng.","Ví dụ: nếu chọn mm, bể 6 × 4 m được vẽ thành hình 6000 × 4000 đơn vị bản vẽ. Tọa độ tuyệt đối 0,0 và tọa độ tương đối @6000,0 hỗ trợ vẽ chính xác.","Sơ đồ công nghệ, mặt bằng, mặt cắt/cao trình và bản vẽ thiết bị có mục đích khác nhau; cần quy ước tên và đơn vị thống nhất."]},{"id":6,"module":"AutoCAD","title":"Lệnh vẽ hình học cơ bản","clo":"CLO1.2 · CLO2.2","points":["LINE (L), PLINE (PL), CIRCLE (C) tạo đường và đường tròn.","ARC (A), RECTANGLE (REC), POLYGON (POL) tạo hình học chuẩn.","ELLIPSE (EL), SPLINE (SPL) tạo đường elip và đường cong."],"practice":["Vẽ bể chữ nhật kích thước 6000 × 4000 mm bằng RECTANGLE.","Vẽ đường ống và tâm bể bằng LINE/CIRCLE.","Thử PLINE cho tuyến đường ống nhiều đoạn."],"q":{"prompt":"Lệnh tạo polyline liên tục là gì?","options":["PLINE","PAN","PROPERTIES","PLOT"],"answer":0,"why":"PLINE cho phép tạo chuỗi đoạn thẳng/cung liên tục."},"extras":[{"prompt":"Lệnh tạo đường tròn?","options":["CIRCLE","POLYGON","MIRROR","TRIM"],"answer":0,"why":"CIRCLE vẽ đường tròn."}],"teaching":["LINE tạo đoạn rời; PLINE tạo đường gấp khúc liên tục; CIRCLE vẽ tròn; ARC vẽ cung; RECTANGLE tạo chữ nhật; POLYGON tạo đa giác đều; ELLIPSE và SPLINE tạo đường cong.","Ví dụ: gõ REC → chọn điểm đầu 0,0 → nhập @6000,4000 để tạo hình bể theo đơn vị mm; dùng CIRCLE vẽ lỗ ống.","Bật OSNAP để bắt điểm chính xác và ORTHO/POLAR khi cần vẽ theo phương chuẩn."]},{"id":7,"module":"AutoCAD","title":"Lệnh chỉnh sửa đối tượng","clo":"CLO1.2 · CLO2.2","points":["ERASE (E), MOVE (M), COPY (CO), ROTATE (RO) thao tác với đối tượng.","SCALE (SC), MIRROR (MI), OFFSET (O), TRIM (TR), EXTEND (EX) thay đổi hình học.","FILLET (F), CHAMFER (CHA), EXPLODE (X) hoàn thiện đối tượng."],"practice":["OFFSET tường bể theo bề dày thiết kế giả định.","COPY các mô-đun bể và MOVE về vị trí mặt bằng.","TRIM phần đường ống thừa, kiểm tra kết quả."],"q":{"prompt":"Lệnh nào sao chép một đường song song cách đều?","options":["OFFSET","ERASE","ROTATE","ZOOM"],"answer":0,"why":"OFFSET sinh đối tượng song song/đồng tâm cách một khoảng chỉ định."},"extras":[{"prompt":"Lệnh xóa đối tượng?","options":["ERASE","SCALE","ROTATE","MATCHPROP"],"answer":0,"why":"ERASE dùng xóa đối tượng."}],"teaching":["MOVE di chuyển, COPY sao chép, ROTATE xoay, SCALE thay đổi tỷ lệ, MIRROR lấy đối xứng; ERASE xóa, OFFSET tạo đường song song/đồng tâm.","Ví dụ: dùng OFFSET khoảng 200 mm tạo tường bể giả định; TRIM cắt đoạn thừa; EXTEND kéo đối tượng đến biên; FILLET bo góc và CHAMFER vát mép.","EXPLODE tách đối tượng phức hợp thành thành phần; lưu bản dự phòng trước khi phá block hoặc polyline quan trọng."]},{"id":8,"module":"AutoCAD","title":"Layer, thuộc tính và quản lý bản vẽ","clo":"CLO1.2 · CLO2.2","points":["LAYER (LA) quản lý các lớp hình học riêng biệt.","MATCHPROP (MA) sao chép thuộc tính; PROPERTIES hiệu chỉnh đối tượng.","ISOLATE/UNISOLATE kiểm soát hiển thị các nhóm đối tượng."],"practice":["Tạo layer BE, ONG, KICHTHUOC, CHUTHICH.","Phân biệt màu và nét cho các lớp.","Dựng mặt bằng công trình xử lý nước thải với layer đúng."],"q":{"prompt":"Layer hữu ích nhất để làm gì?","options":["Phân loại và quản lý nhóm đối tượng bản vẽ","Tính COD trung bình","Xuất báo cáo khí nhà kính","Chuyển đơn vị Excel"],"answer":0,"why":"Layer tổ chức, ẩn/hiện và kiểm soát thuộc tính đối tượng bản vẽ."},"extras":[{"prompt":"Lệnh sao chép thuộc tính?","options":["MATCHPROP","MOVE","LINE","BLOCK"],"answer":0,"why":"MATCHPROP sao chép thuộc tính giữa các đối tượng."}],"teaching":["Layer giúp tách bể, đường ống, kích thước và chú thích để kiểm soát màu, loại nét, độ dày nét, bật/tắt và khóa đối tượng.","Ví dụ: tạo BE, ONG, KICHTHUOC, CHUTHICH bằng LAYER (LA); MATCHPROP (MA) sao chép thuộc tính; PROPERTIES kiểm tra tọa độ và kích thước.","Dùng ISOLATE để tập trung sửa một nhóm đối tượng, sau đó UNISOLATE để khôi phục hiển thị."]},{"id":9,"module":"AutoCAD","title":"Kích thước, ghi chú và Hatch","clo":"CLO1.2 · CLO2.2","points":["DIMLINEAR, DIMALIGNED, DIMRADIUS, DIMDIAMETER, DIMANGULAR ghi kích thước.","LEADER, TEXT/MTEXT, TABLE tạo chú thích và bảng.","HATCH thể hiện vật liệu hoặc phần mặt cắt."],"practice":["Ghi kích thước dài/rộng cho bể 6000 × 4000 mm.","Tạo LEADER cho cửa vào và cửa ra.","HATCH mặt cắt tường bể."],"q":{"prompt":"Lệnh ghi kích thước đường kính hình tròn là gì?","options":["DIMDIAMETER","DIMLINEAR","HATCH","SPLINE"],"answer":0,"why":"DIMDIAMETER gắn kích thước đường kính."},"extras":[{"prompt":"Lệnh tô vật liệu mặt cắt?","options":["HATCH","VIEW","PAN","REGEN"],"answer":0,"why":"HATCH tô vật liệu, mặt cắt."}],"teaching":["DIMLINEAR dùng kích thước ngang/dọc; DIMALIGNED theo cạnh nghiêng; DIMRADIUS, DIMDIAMETER và DIMANGULAR ghi bán kính, đường kính và góc.","Dùng MTEXT ghi chú nhiều dòng; LEADER tạo mũi tên chú thích; HATCH thể hiện vật liệu mặt cắt; TABLE tạo bảng thông số.","Ví dụ: ghi 6000 × 4000 mm cho bể, chú thích ống vào/ra và hatch tường bể. Thiết lập kiểu DIMSTYLE thống nhất trước khi in."]},{"id":10,"module":"AutoCAD","title":"Zoom, Pan và quản lý góc nhìn","clo":"CLO1.2 · CLO2.2","points":["ZOOM (Z) thay đổi mức phóng đại hiển thị.","PAN (P) di chuyển vùng nhìn mà không làm thay đổi tọa độ đối tượng.","REGEN (RE), VIEW (V), VIEWRES quản lý cập nhật và chất lượng hiển thị."],"practice":["Thực hành Zoom Extents và Zoom Window.","Dùng PAN để kiểm tra tất cả chi tiết.","Lưu một góc nhìn với VIEW."],"q":{"prompt":"Lệnh nào di chuyển vùng nhìn mà không dịch chuyển đối tượng?","options":["PAN","MOVE","COPY","MIRROR"],"answer":0,"why":"PAN chỉ dịch chuyển vùng quan sát."},"extras":[{"prompt":"Lệnh tạo block?","options":["BLOCK","SPLINE","HLOOKUP","SUM"],"answer":0,"why":"BLOCK tạo định nghĩa đối tượng nhóm."}],"teaching":["ZOOM chỉ thay đổi mức nhìn, không thay đổi kích thước đối tượng; PAN di chuyển vùng quan sát; REGEN tái tạo hiển thị; VIEW lưu góc nhìn; VIEWRES liên quan độ mịn hiển thị đường cong.","Ví dụ: Z → E (Zoom Extents) để xem toàn bộ bản vẽ, sau đó Zoom Window kiểm tra chi tiết một cụm bể.","Đừng nhầm PAN với MOVE: PAN chỉ di chuyển màn hình, MOVE thay đổi vị trí hình học thật."]},{"id":11,"module":"AutoCAD","title":"Block, nhóm đối tượng và in Layout","clo":"CLO1.2 · CLO2.2","points":["BLOCK (B), INSERT (I), WBLOCK (WB), EXPLODE (X), GROUP (G) quản lý nhóm.","Layout và Viewport trình bày bản vẽ, khung tên, tỷ lệ và ghi chú.","Kiểm tra nét, khổ giấy, tỷ lệ trước khi in hoặc xuất PDF."],"practice":["Tạo block ký hiệu máy bơm và chèn nhiều vị trí.","Dựng Layout khổ A3, Viewport và khung tên.","Kiểm tra trước khi in."],"q":{"prompt":"Để chèn block đã tạo vào bản vẽ, dùng lệnh nào?","options":["INSERT","HATCH","TRIM","REGEN"],"answer":0,"why":"INSERT chèn block vào bản vẽ."},"extras":[{"prompt":"Xe tải của doanh nghiệp đốt dầu trực tiếp thường thuộc?","options":["Scope 1","Scope 2","Scope 3","Không tính"],"answer":0,"why":"Nhiên liệu xe thuộc kiểm soát doanh nghiệp thường thuộc Scope 1."}],"teaching":["BLOCK gom nhiều hình học thành một ký hiệu có thể tái sử dụng; INSERT chèn; WBLOCK lưu block ra file riêng; GROUP tạo nhóm chọn; EXPLODE phân rã đối tượng.","Ví dụ: tạo block máy bơm, chèn tại các bể; trong Layout tạo Viewport, chọn khổ A3, đặt tỷ lệ hiển thị và khung tên rồi Plot/Export PDF.","Kiểm tra kích thước, chiều dày nét, kiểu chữ và không để viewport đổi tỷ lệ ngoài ý muốn."]},{"id":12,"module":"AutoCAD","title":"Thực hành tổng hợp và tự kiểm tra giữa kỳ","clo":"CLO1.2 · CLO2.2","points":["Hoàn thiện sơ đồ công nghệ, mặt bằng, cao trình, chi tiết thiết bị.","Rà soát layer, kích thước, chú thích, tỷ lệ, Layout.","Đề cương dành một giờ kiểm tra giữa kỳ trong buổi 12."],"practice":["Lập bản vẽ mặt bằng bể điều hòa, bể lắng và tuyến ống (kích thước giả định).","Xuất PDF và lưu tệp DWG để nộp.","Tự kiểm tra đầy đủ các tiêu chí bản vẽ."],"q":{"prompt":"Trong hồ sơ bản vẽ, hạng mục nào giúp người đọc nhận biết kích thước thực?","options":["Ghi kích thước và tỷ lệ","Màu nền phần mềm","Hình nền máy tính","Tên thư mục"],"answer":0,"why":"Kích thước và tỷ lệ là thông tin bắt buộc để diễn giải hình học kỹ thuật."},"extras":[{"prompt":"Vận tải thuê ngoài của doanh nghiệp thường được phân loại?","options":["Scope 3","Scope 2","Scope 1","Không bao giờ tính"],"answer":0,"why":"Vận tải thuê ngoài thường là phát thải gián tiếp Scope 3 theo ranh giới phù hợp."}],"teaching":["Bài thực hành tổng hợp kết nối các kỹ năng từ buổi 5–11: dựng mặt bằng, sơ đồ công nghệ, mặt cắt/cao trình và chi tiết thiết bị ở mức học tập.","Gợi ý trình tự: tạo Layer → dựng hình bằng LINE/RECTANGLE → chỉnh sửa OFFSET/TRIM → ghi kích thước → tạo BLOCK → bố trí Layout và in PDF.","Tự rà soát: đúng đơn vị, kích thước, bản vẽ có nhãn/khung tên, không thiếu chú thích và tệp DWG được lưu đúng phiên bản."]},{"id":13,"module":"GHG","title":"GHG Protocol và Scope 1, 2, 3","clo":"CLO2.1 · CLO3.1","points":["GHG Protocol hướng dẫn kiểm kê và lượng hóa phát thải khí nhà kính.","Scope 1: phát thải trực tiếp từ nguồn thuộc sở hữu/kiểm soát của tổ chức.","Scope 2: phát thải gián tiếp từ năng lượng mua; Scope 3: các phát thải gián tiếp khác trong chuỗi giá trị."],"practice":["Phân loại khí đốt tại lò hơi của nhà máy.","Phân loại điện mua từ lưới và vận chuyển thuê ngoài.","Thảo luận ranh giới kiểm kê cho nhà máy xi măng."],"q":{"prompt":"Điện năng mua từ lưới thường được báo cáo ở phạm vi nào?","options":["Scope 2","Scope 1","Scope 3","Không thuộc phạm vi nào"],"answer":0,"why":"Scope 2 là phát thải gián tiếp từ điện/hơi/nhiệt/làm mát mua vào theo quy tắc thích hợp."},"extras":[{"prompt":"Điện mua dùng trong nhà máy thuộc?","options":["Scope 2","Scope 1","Scope 3","Không tính"],"answer":0,"why":"Điện mua được tính Scope 2."}],"teaching":["GHG Protocol phân biệt Scope 1 (trực tiếp từ nguồn sở hữu/kiểm soát), Scope 2 (gián tiếp từ năng lượng mua) và Scope 3 (gián tiếp khác trong chuỗi giá trị).","Ví dụ: dầu đốt tại lò hơi thuộc Scope 1; điện mua từ lưới thuộc Scope 2; vận tải hàng hóa thuê ngoài thường thuộc Scope 3 theo ranh giới kiểm kê.","Trước khi phân loại cần xác định ranh giới tổ chức và ranh giới hoạt động; tránh tính trùng cùng một nguồn trong bảng kiểm kê."]},{"id":14,"module":"GHG","title":"Công cụ Excel, dữ liệu hoạt động, đốt cháy và vận tải","clo":"CLO2.1 · CLO3.1","points":["Xây dựng bảng dữ liệu hoạt động và hệ số phát thải theo từng nguồn.","Công thức cơ sở: Phát thải = Dữ liệu hoạt động × Hệ số phát thải (sau khi thống nhất đơn vị).","Thực hành cho nguồn đốt cố định và nguồn di động; lưu thông tin nguồn, năm và phương pháp."],"practice":["Thiết lập bảng cho nhiên liệu lò hơi, phương tiện vận tải, điện mua.","Tính CO₂e khi hệ số đã ở đơn vị kg CO₂e/đơn vị hoạt động.","Ghi nguồn hệ số, đơn vị, giả định và kiểm tra trùng lặp."],"q":{"prompt":"Khi tính phát thải, vấn đề nào phải kiểm tra đầu tiên?","options":["Đơn vị của dữ liệu hoạt động và hệ số phát thải","Màu sắc ô Excel","Phông chữ tiêu đề","Vị trí biểu tượng"],"answer":0,"why":"Đơn vị không thống nhất dẫn đến sai lệch rất lớn trong tính toán."},"extras":[{"prompt":"Trong Excel, AVERAGE dùng để?","options":["Tính trung bình","Đếm ô chữ","Tìm giá trị nhỏ nhất","Tô màu ô"],"answer":0,"why":"AVERAGE tính trung bình cộng."}],"teaching":["Công thức cốt lõi: phát thải = dữ liệu hoạt động × hệ số phát thải. Khi hệ số có đơn vị kg CO₂e/đơn vị, chia kết quả cho 1000 để ra t CO₂e.","Ví dụ minh họa: 1000 lít nhiên liệu × hệ số giả định 2,5 kg CO₂e/lít = 2,5 t CO₂e. Đây không phải hệ số khuyến nghị chính thức.","Trong Excel, lập các cột Nguồn | Scope | Hoạt động | Đơn vị | Hệ số | Nguồn hệ số | t CO₂e; rà soát nhiệt trị, đơn vị và GWP khi tính từng khí riêng."]},{"id":15,"module":"GHG","title":"Lập bảng kiểm kê Scope 1–3 và CO₂e theo ngành","clo":"CLO2.1 · CLO3.1","points":["Đề cương yêu cầu thực hành bằng Excel cho nhà máy xi măng, thủy sản, giấy, gỗ và dược phẩm.","Tổng hợp phát thải theo Scope 1, Scope 2 và Scope 3 khi phù hợp với ranh giới kiểm kê.","Rà soát chất lượng dữ liệu, hệ số phát thải, trùng lặp, nguồn chứng minh và kết quả."],"practice":["Chọn một trong năm loại hình nhà máy và lập danh mục nguồn phát thải.","Xây dựng bảng tính Scope 1/2/3, tổng CO₂e, tóm tắt phương pháp.","Trình bày báo cáo ngắn và tự đánh giá sai số/giới hạn dữ liệu."],"q":{"prompt":"Tổng phát thải CO₂e được tính thế nào khi từng dòng đã quy đổi về tCO₂e?","options":["Cộng các dòng hợp lệ, tránh trùng lặp và cùng ranh giới","Cộng trực tiếp lượng điện kWh với diesel lít","Lấy giá trị lớn nhất","Lấy số nhân viên nhân diện tích"],"answer":0,"why":"Chỉ cộng các lượng phát thải đã quy về cùng đơn vị, cùng ranh giới và tránh trùng lặp."},"teaching":["Mỗi loại nhà máy (xi măng, thủy sản, giấy, gỗ, dược phẩm) cần liệt kê nguồn trực tiếp, điện mua và các hoạt động gián tiếp phù hợp ranh giới kiểm kê.","Ví dụ cấu trúc tổng hợp: SUMIF theo Scope để có tổng Scope 1, 2, 3, sau đó cộng các kết quả đã thống nhất về t CO₂e. Cần lưu bằng chứng dữ liệu và năm kiểm kê.","Kiểm tra chất lượng: phát hiện thiếu nguồn, trùng lặp, đơn vị sai, hệ số không rõ xuất xứ; trình bày giả định và độ không chắc chắn."]}],en:[{"id":1,"module":"Excel","title":"Introduction to Excel, data entry and quality control","clo":"CLO1.1 · CLO2.1","points":["Excel organizes environmental measurements into rows and columns. Distinguish numeric values, dates, text, units and missing observations. Sort, Filter and Data Validation help detect errors.","Each row should represent one sample; each column should have one variable and a consistent unit."],"practice":["Create a table of sample IDs, sampling dates, pH, DO and COD. Filter COD greater than 50 mg/L and restrict pH entries to 0–14.","A blank value, zero and a measurement below detection limit are not equivalent."],"teaching":["Each row should represent one sample; each column should have one variable and a consistent unit.","Example: use Data → Filter to inspect COD above 50 mg/L; use Data Validation for pH between 0 and 14.","A blank value, zero and a measurement below detection limit are not equivalent."],"q":{"prompt":"Which tool restricts allowable pH entries?","options":["Data Validation","Merge Cells","Page Layout","Freeze Panes"],"answer":0,"why":"Data Validation enforces rules for user input."},"extras":[{"prompt":"Which function returns the median?","options":["MEDIAN","MODE","SUM","COUNT"],"answer":0,"why":"MEDIAN returns the middle value."}]},{"id":2,"module":"Excel","title":"Statistical, mathematical and conditional functions","clo":"CLO1.1 · CLO2.1","points":["AVERAGE, MEDIAN, MODE, MIN, MAX, COUNT and COUNTA summarize measurements. SUM, PRODUCT, SQRT and LOG perform calculations. IF, IFERROR, COUNTIF and SUMIF handle conditions.","AVERAGE returns the mean, MEDIAN the middle value, COUNT counts numbers, and COUNTA counts nonempty cells."],"practice":["Compute mean COD from ten samples; flag values above a practice threshold; count those values with COUNTIF.","A practice threshold is not an official regulatory limit. Investigate errors rather than hiding them with IFERROR."],"teaching":["AVERAGE returns the mean, MEDIAN the middle value, COUNT counts numbers, and COUNTA counts nonempty cells.","Use =AVERAGE(C2:C11), =IF(C2>50,\"Exceeds\",\"Meets\") and =COUNTIF(C2:C11,\">50\").","A practice threshold is not an official regulatory limit. Investigate errors rather than hiding them with IFERROR."],"q":{"prompt":"Which formula counts values greater than 50 in C2:C11?","options":["=COUNTIF(C2:C11,\">50\")","=SUM(C2:C11)","=AVERAGE(C2:C11)","=COUNT(C2:C11)"],"answer":0,"why":"COUNTIF counts cells that meet the specified criterion."},"extras":[{"prompt":"Which function finds the maximum?","options":["MAX","MIN","AVERAGE","LEFT"],"answer":0,"why":"MAX returns the greatest value."}]},{"id":3,"module":"Excel","title":"Text functions, lookup and regression","clo":"CLO1.1 · CLO2.1","points":["LEFT, RIGHT, MID and TRIM clean sample identifiers; CONCATENATE joins text. VLOOKUP, HLOOKUP, INDEX and MATCH find information. The Analysis ToolPak supports regression.","Use text functions to separate codes and TRIM to remove unnecessary spaces."],"practice":["Extract a station code from HN-WS-001; look up station names; regress COD against time.","Regression y=a+bx estimates a relationship. Review the slope, R² and residuals; correlation does not establish causation."],"teaching":["Use text functions to separate codes and TRIM to remove unnecessary spaces.","Example: =VLOOKUP(A2,$F$2:$G$20,2,FALSE); the dollar signs fix the lookup range.","Regression y=a+bx estimates a relationship. Review the slope, R² and residuals; correlation does not establish causation."],"q":{"prompt":"Which function removes extra spaces from a text string?","options":["TRIM","MAX","SQRT","COUNT"],"answer":0,"why":"TRIM removes redundant spaces."},"extras":[{"prompt":"Which function joins text values?","options":["CONCATENATE","COUNTIF","SQRT","SUMIF"],"answer":0,"why":"CONCATENATE joins text strings."}]},{"id":4,"module":"Excel","title":"Environmental charts and PivotTables","clo":"CLO1.1 · CLO2.1","points":["Line charts show trends over time; bar charts compare categories; pie charts show meaningful proportions. PivotTables aggregate data across monitoring stations and periods.","Choose a chart based on the question: line for time, bars for comparisons, pie for parts of a whole."],"practice":["Plot monthly COD, build a PivotTable of mean COD by station and month, and label axes with units.","Always label units and sources; make missing observations visible."],"teaching":["Choose a chart based on the question: line for time, bars for comparisons, pie for parts of a whole.","Example PivotTable: Rows = Station, Columns = Month, Values = Average of COD.","Always label units and sources; make missing observations visible."],"q":{"prompt":"Which chart best shows COD changes over 12 months?","options":["Line chart","Pie chart","Radar chart","Bubble chart"],"answer":0,"why":"A line chart is suitable for showing changes over time."},"extras":[{"prompt":"Which tool summarizes data by group?","options":["PivotTable","Data Validation","Zoom","Offset"],"answer":0,"why":"PivotTable summarizes data by category."}]},{"id":5,"module":"AutoCAD","title":"AutoCAD basics, units and coordinates","clo":"CLO1.2 · CLO2.2","points":["Recognize process flow diagrams, plans, elevations and equipment drawings. Model Space is used for full-size geometry; Layout arranges printed sheets.","UNITS specifies drawing unit settings; coordinates locate objects precisely."],"practice":["Set drawing units to millimeters and create a 6000 × 4000 mm tank footprint.","Keep units, drawing conventions and coordinate references consistent."],"teaching":["UNITS specifies drawing unit settings; coordinates locate objects precisely.","A 6 m × 4 m tank becomes 6000 × 4000 drawing units when working in millimeters.","Keep units, drawing conventions and coordinate references consistent."],"q":{"prompt":"Which command sets drawing units in AutoCAD?","options":["UNITS","TRIM","PAN","HATCH"],"answer":0,"why":"UNITS configures drawing units and precision."},"extras":[{"prompt":"Which command draws a rectangle?","options":["RECTANGLE","CIRCLE","PAN","OFFSET"],"answer":0,"why":"RECTANGLE creates rectangular geometry."}]},{"id":6,"module":"AutoCAD","title":"Basic drawing commands","clo":"CLO1.2 · CLO2.2","points":["LINE, PLINE and CIRCLE create lines, connected polylines and circles. ARC, RECTANGLE, POLYGON, ELLIPSE and SPLINE create other shapes.","LINE creates individual segments, while PLINE creates connected segments."],"practice":["Draw a 6000 × 4000 mm rectangular tank, an inlet pipe and a multisegment pipeline.","Enable OSNAP for accurate point selection and ORTHO or POLAR when appropriate."],"teaching":["LINE creates individual segments, while PLINE creates connected segments.","Use RECTANGLE from 0,0 to @6000,4000 to draw the tank.","Enable OSNAP for accurate point selection and ORTHO or POLAR when appropriate."],"q":{"prompt":"Which command creates a continuous polyline?","options":["PLINE","PAN","PROPERTIES","PLOT"],"answer":0,"why":"PLINE creates connected line and arc segments."},"extras":[{"prompt":"Which command draws a circle?","options":["CIRCLE","POLYGON","MIRROR","TRIM"],"answer":0,"why":"CIRCLE creates circles."}]},{"id":7,"module":"AutoCAD","title":"Object editing commands","clo":"CLO1.2 · CLO2.2","points":["ERASE, MOVE, COPY and ROTATE change objects. SCALE, MIRROR, OFFSET, TRIM and EXTEND modify geometry. FILLET, CHAMFER and EXPLODE provide further edits.","MOVE changes position, COPY duplicates, ROTATE turns, and SCALE resizes."],"practice":["OFFSET a tank wall by 200 mm; duplicate modules with COPY; remove unnecessary pipe sections with TRIM.","EXPLODE separates compound geometry; keep a backup of important blocks."],"teaching":["MOVE changes position, COPY duplicates, ROTATE turns, and SCALE resizes.","OFFSET produces a parallel contour. TRIM removes excess geometry and EXTEND reaches a boundary.","EXPLODE separates compound geometry; keep a backup of important blocks."],"q":{"prompt":"Which command creates a parallel offset object?","options":["OFFSET","ERASE","ROTATE","ZOOM"],"answer":0,"why":"OFFSET creates parallel or concentric geometry at a specified distance."},"extras":[{"prompt":"Which command deletes objects?","options":["ERASE","SCALE","ROTATE","MATCHPROP"],"answer":0,"why":"ERASE removes selected objects."}]},{"id":8,"module":"AutoCAD","title":"Layers and drawing management","clo":"CLO1.2 · CLO2.2","points":["LAYER organizes tanks, pipes, dimensions and annotations. MATCHPROP copies object properties; PROPERTIES edits them. ISOLATE temporarily hides unrelated objects.","Separate drawing elements into named layers to manage their appearance and editing."],"practice":["Create layers TANK, PIPE, DIMENSION and NOTES with different line properties.","Remember to restore visibility after working with ISOLATE."],"teaching":["Separate drawing elements into named layers to manage their appearance and editing.","Use LAYER (LA) to make layers and MATCHPROP (MA) to copy appearance settings.","Remember to restore visibility after working with ISOLATE."],"q":{"prompt":"What is the main benefit of layers?","options":["Organizing and managing drawing objects","Computing mean COD","Calculating GHG emissions","Converting Excel units"],"answer":0,"why":"Layers group and control object appearance and visibility."},"extras":[{"prompt":"Which command copies object properties?","options":["MATCHPROP","MOVE","LINE","BLOCK"],"answer":0,"why":"MATCHPROP transfers properties between objects."}]},{"id":9,"module":"AutoCAD","title":"Dimensions, annotations and hatching","clo":"CLO1.2 · CLO2.2","points":["DIMLINEAR, DIMALIGNED, DIMRADIUS, DIMDIAMETER and DIMANGULAR label dimensions. LEADER, TEXT, MTEXT, TABLE and HATCH add notes and material patterns.","Choose dimension commands according to horizontal, sloped, circular or angular measurements."],"practice":["Dimension the tank; label inlet and outlet pipes; hatch a concrete wall section.","Use a consistent dimension style and verify legibility before plotting."],"teaching":["Choose dimension commands according to horizontal, sloped, circular or angular measurements.","Add 6000 × 4000 mm dimensions, leader notes, and hatch patterns in a section view.","Use a consistent dimension style and verify legibility before plotting."],"q":{"prompt":"Which command adds a diameter dimension?","options":["DIMDIAMETER","DIMLINEAR","HATCH","SPLINE"],"answer":0,"why":"DIMDIAMETER displays circle or arc diameters."},"extras":[{"prompt":"Which command applies material hatching?","options":["HATCH","VIEW","PAN","REGEN"],"answer":0,"why":"HATCH displays section patterns."}]},{"id":10,"module":"AutoCAD","title":"Zoom, Pan and views","clo":"CLO1.2 · CLO2.2","points":["ZOOM changes magnification; PAN moves the viewpoint without moving the objects. REGEN refreshes the display; VIEW manages saved views.","ZOOM and PAN affect the viewport, not object coordinates."],"practice":["Use Zoom Extents, inspect detail with Zoom Window, and save a view.","Do not confuse PAN with MOVE: MOVE changes real geometry."],"teaching":["ZOOM and PAN affect the viewport, not object coordinates.","Enter Z → E to zoom to extents and PAN to inspect the tank layout.","Do not confuse PAN with MOVE: MOVE changes real geometry."],"q":{"prompt":"Which command moves the view without changing object coordinates?","options":["PAN","MOVE","COPY","MIRROR"],"answer":0,"why":"PAN changes only the viewing window."},"extras":[{"prompt":"Which command creates a block?","options":["BLOCK","SPLINE","HLOOKUP","SUM"],"answer":0,"why":"BLOCK defines reusable objects."}]},{"id":11,"module":"AutoCAD","title":"Blocks, groups and printing layouts","clo":"CLO1.2 · CLO2.2","points":["BLOCK defines reusable symbols; INSERT places them; WBLOCK exports them. GROUP groups selections. Layout and Viewports prepare technical sheets for plotting.","Reusable blocks simplify repeated symbols; viewports define paper views of model geometry."],"practice":["Make a pump block; insert copies; create an A3 Layout and export a PDF.","Check dimensions, line weights, fonts and viewport scale before printing."],"teaching":["Reusable blocks simplify repeated symbols; viewports define paper views of model geometry.","Insert a pump symbol, create an A3 title block and select a plotting scale.","Check dimensions, line weights, fonts and viewport scale before printing."],"q":{"prompt":"Which command inserts a previously created block?","options":["INSERT","HATCH","TRIM","REGEN"],"answer":0,"why":"INSERT places an existing block definition."},"extras":[{"prompt":"A company-controlled truck burning diesel is typically in which scope?","options":["Scope 1","Scope 2","Scope 3","Not ope 2; outsourced freight may be Scope 3.","Avoid double counting and document inventory boundaries."],"q":{"prompt":"Which scope normally includes purchased grid electricity?","options":["Scope 2","Scope 1","Scope 3","No scope"],"answer":0,"why":"Scope 2 includes indirect emissions from purchased energy."},"extras":[{"prompt":"Electricity purchased by a factory belongs to which scope?","options":["Scope 2","Scope 1","Scope 3","Not counted"],"answer":0,"why":"Purchased electricity is reported under Scope 2."}]},{"id":14,"module":"GHG","title":"Excel emission tools, activity data and transport","clo":"CLO2.1 · CLO3.1","points":["Emissions = activity data × emission factor, with consistent units. Where a factor is in kg CO₂e per activity unit, divide by 1000 to obtain t CO₂e.","Record sources, activity values, units, emission factors, calculation years and methods."],"practice":["Build an Excel table for boiler fuel, vehicle fuel and purchased electricity with emission factors and data sources.","Emission factors used in exercises are illustrative, not official factors; account for individual gases and GWP if required."],"teaching":["Record sources, activity values, units, emission factors, calculation years and methods.","Example only: 1000 L × a hypothetical 2.5 kg CO₂e/L = 2.5 t CO₂e.","Emission factors used in exercises are illustrative, not official factors; account for individual gases and GWP if required."],"q":{"prompt":"What should you verify first when calculating emissions?","options":["Activity and emission-factor units","Cell background color","Font family","Icon position"],"answer":0,"why":"Inconsistent units can cause major calculation errors."},"extras":[{"prompt":"What does AVERAGE do in Excel?","options":["Calculates the mean","Counts text cells","Finds minimum","Fills cells"],"answer":0,"why":"AVERAGE calculates the arithmetic mean."}]},{"id":15,"module":"GHG","title":"GHG inventory by industry and Scope","clo":"CLO2.1 · CLO3.1","points":["Build Scope 1, Scope 2 and Scope 3 inventories for cement, seafood, paper, wood processing or pharmaceutical facilities. Summarize emissions in t CO₂e.","Define organizational boundaries and identify direct, purchased-energy and value-chain sources."],"practice":["Select an industry and prepare an inventory table, source documentation and a short quality-assurance report.","Check missing sources, double counting, measurement units, evidence and uncertainty."],"teaching":["Define organizational boundaries and identify direct, purchased-energy and value-chain sources.","Use SUMIF to summarize emissions by scope, then sum valid values in t CO₂e.","Check missing sources, double counting, measurement units, evidence and uncertainty."],"q":{"prompt":"How should total emissions be calculated after all rows are converted to t CO₂e?","options":["Sum valid nonoverlapping rows within the same boundary","Add kWh directly to liters","Take the maximum row","Multiply staff count by land area"],"answer":0,"why":"Only compatible emission totals within a consistent boundary should be summed."}}]};

function section(title,inner){$('main').innerHTML='<section class="panel"><h2>'+title+'</h2>'+inner+'</section>'};
function list(xs){return '<ol>'+xs.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>'}
function renderHeader(){const t=T();document.documentElement.lang=lang;document.title=t.brand+' · DC3MO19';for(const [id,v] of Object.entries({brand:t.brand,subtitle:t.sub,school:t.school,navtitle:t.nav,sessionsTitle:t.sessions,offline:t.offline,author:t.author,affiliation:t.aff,disclaimer:t.disc}))$(id).textContent=v;$('viBtn').classList.toggle('active',lang==='vi');$('enBtn').classList.toggle('active',lang==='en');$('nav').innerHTML=[['home',t.home],['excel',t.excel],['cad',t.cad],['ghg',t.ghg],['lab',t.lab],['exam',t.exam],['progress',t.progress]].map(([k,v])=>'<button data-page="'+k+'" class="'+(page===k?'active':'')+'">'+v+'</button>').join('');$('sessions').innerHTML=L().map(l=>'<button class="lessonbtn '+(page==='L'+l.id?'active':'')+'" data-page="L'+l.id+'">'+t.session+' '+l.id+': '+esc(l.title)+'<small>'+esc(l.module)+' · '+(progress.done[l.id]?t.complete:t.pending)+'</small></button>').join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page))}
function navigate(p){page=p;subtab='theory';render();window.scrollTo(0,0)}
function changeLang(next){lang=next;render()}
function render(){renderHeader();const t=T();if(page==='home')home();else if(['excel','cad','ghg'].includes(page))modules(page);else if(/^L\d+$/.test(page))lesson(Number(page.slice(1)));else if(page==='lab')lab();else if(page==='exam')exam();else if(page==='progress')showProgress();else home()}
function home(){const t=T(),done=Object.values(progress.done).filter(Boolean).length;section(t.overview,'<div class="cards">'+[[3,t.units],[15,t.sessionsCount],[done+'/15',t.done],['20–30–50%',t.weights]].map(([v,k])=>'<div class="card"><strong>'+v+'</strong>'+k+'</div>').join('')+'</div><h3>'+t.allocation+'</h3><div class="tablewrap"><table><tr><th>'+t.chapter+'</th><th>'+t.theoryHours+'</th><th>'+t.practiceHours+'</th><th>'+t.testHours+'</th><th>'+t.total+'</th></tr>'+t.modules.map((m,i)=>'<tr><td>'+m+'</td><td>'+[4,7,3][i]+'</td><td>'+[16,32,12][i]+'</td><td>'+[0,1,0][i]+'</td><td>'+[20,40,15][i]+'</td></tr>').join('')+'<tr><th>'+t.total+'</th><th>14</th><th>60</th><th>1</th><th>75</th></tr></table></div><h3>'+t.how+'</h3><p>'+t.howText+'</p><p><button class="primary" id="start">'+t.start+'</button></p>');$('start').onclick=()=>navigate('L1')}
function modules(m){const ix=['excel','cad','ghg'].indexOf(m),t=T(),module=['Excel','AutoCAD','GHG'][ix],xs=L().filter(l=>l.module===module);section(t.modules[ix],'<p>'+t.moduleDescriptions[ix]+'</p><div class="cards">'+xs.map(l=>'<div class="card"><span class="tag">'+t.session+' '+l.id+'</span><h3>'+esc(l.title)+'</h3><p>'+l.clo+'</p><button data-open="'+l.id+'">'+t.open+'</button></div>').join('')+'</div>');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>navigate('L'+b.dataset.open))}
function lesson(id){const t=T(),l=L()[id-1];if(!l)return;let body='<div class="tabs">'+[['theory',t.theory],['practice',t.practice],['quiz',t.quiz]].map(([k,v])=>'<button data-sub="'+k+'" class="'+(subtab===k?'active':'')+'">'+v+'</button>').join('')+'</div>';
if(subtab==='theory')body+='<h3>'+t.key+'</h3>'+list(l.points)+'<h3>'+t.teaching+'</h3><div class="teaching">'+l.teaching.map((s,i)=>'<p><b>'+[t.explain,t.example,t.caution][i]+':</b> '+esc(s)+'</p>').join('')+'</div><p><button id="gotoLab">'+t.openLab+'</button></p>';
if(subtab==='practice')body+='<h3>'+t.tasks+'</h3>'+list(l.practice)+'<p class="note">'+t.practiceNote+'</p><label><span><input type="checkbox" id="checkDone" '+(progress.done[id]?'checked':'')+'> '+t.marked+'</span></label><p><button class="primary" id="saveDone">'+t.save+'</button></p><p id="savedMessage"></p>';
if(subtab==='quiz'){const qs=[l.q,...(l.extras||[])];body+='<h3>'+t.quick+'</h3>'+qs.map((q,i)=>'<fieldset><legend><b>'+t.question+' '+(i+1)+'.</b> '+esc(q.prompt)+'</legend>'+q.options.map((s,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'">'+esc(s)+'</label>').join('')+'<div id="feedback'+i+'"></div></fieldset>').join('')+'<p><button class="primary" id="grade">'+t.grade+'</button></p><div id="quizResult"></div>'}
body+='<p class="mut">'+t.clo+': '+l.clo+'</p><div class="tabs"><button id="previous">'+t.prev+'</button><button id="next">'+t.next+'</button></div>';section('<span class="tag">'+l.module+' · '+t.session+' '+id+'</span><div>'+esc(l.title)+'</div>',body);document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{subtab=b.dataset.sub;lesson(id)});$('previous').onclick=()=>navigate('L'+Math.max(1,id-1));$('next').onclick=()=>navigate('L'+Math.min(15,id+1));if($('gotoLab'))$('gotoLab').onclick=()=>navigate('lab');if($('saveDone'))$('saveDone').onclick=()=>{progress.done[id]=$('checkDone').checked;saved();$('savedMessage').textContent=t.saved;renderHeader()};if($('grade'))$('grade').onclick=()=>{const qs=[l.q,...(l.extras||[])];let correct=0;qs.forEach((q,i)=>{const chosen=document.querySelector('input[name="q'+i+'"]:checked');const ok=Boolean(chosen)&&Number(chosen.value)===q.answer;if(ok)correct++;const feedback='<p class="result">'+(ok?'✓ '+t.correct:'✗ '+t.incorrect)+' · '+t.answer+': <b>'+esc(q.options[q.answer])+'</b>. '+esc(q.why)+'</p>';$('feedback'+i).innerHTML=feedback});const pct=Math.round(correct/qs.length*100);progress.scores[id]=pct;saved();$('quizResult').innerHTML='<p class="result"><b>'+t.score+': '+correct+'/'+qs.length+' · '+pct+'%</b>. '+t.tryAgain+'</p>'}}

function lab(){const t=T();section(t.labTitle,'<p class="mut">'+t.labNote+'</p><div class="tabs">'+[['excel','📊 Excel'],['cad','📐 AutoCAD'],['ghg','🌿 GHG']].map(([k,v])=>'<button data-lab="'+k+'" class="'+(labMode===k?'active':'')+'">'+v+'</button>').join('')+'</div><div id="labContent"></div>');document.querySelectorAll('[data-lab]').forEach(b=>b.onclick=()=>{labMode=b.dataset.lab;lab()});labView()}
function labView(){const t=T();if(labMode==='excel'){$('labContent').innerHTML='<h3>'+t.codTitle+'</h3><p>'+t.codIntro+'</p><label style="display:block">'+t.codValues+'<input id="cod" style="width:100%" value="28;35;42;51;45;63;30;55;39;48"></label><div class="row"><label>'+t.threshold+'<input type="number" id="threshold" value="50"></label><button class="primary" id="calcExcel">'+t.analyze+'</button></div><div id="excelOutput"></div><p><b>'+t.excelFormulas+':</b> <code>=AVERAGE(B2:B11)</code>, <code>=MIN(B2:B11)</code>, <code>=MAX(B2:B11)</code>, <code>=COUNTIF(B2:B11,">50")</code></p>';$('calcExcel').onclick=()=>{const values=$('cod').value.split(/[;,\n]+/).map(s=>s.trim());let a=values.map(Number),v=$('threshold').value,limit=Number(v);if(a.length<2||a.some(x=>!Number.isFinite(x)||x<0)||v.trim()===''||!Number.isFinite(limit)){$('excelOutput').textContent=t.invalidCOD;return}let mean=a.reduce((x,y)=>x+y,0)/a.length;$('excelOutput').innerHTML='<div class="cards">'+[[a.length,t.count],[mean.toFixed(2),t.mean],[Math.min(...a)+'–'+Math.max(...a),t.range],[a.filter(x=>x>limit).length,t.above]].map(([v,label])=>'<div class="card"><strong>'+v+'</strong>'+label+'</div>').join('')+'</div>'};$('calcExcel').click()}
else if(labMode==='cad'){$('labContent').innerHTML='<h3>'+t.cadTitle+'</h3><p>'+t.cadIntro+'</p><div class="row"><label>'+t.length+'<input id="length" type="number" value="6" step=".1"></label><label>'+t.width+'<input id="width" type="number" value="4" step=".1"></label><button class="primary" id="draw">'+t.draw+'</button></div><canvas id="cadCanvas" width="780" height="310"></canvas><p id="cadOutput"></p><p>'+t.cadSteps+': <code>UNITS</code> → <code>RECTANGLE</code> → <code>DIMLINEAR</code> → <code>LAYER</code> → <code>LAYOUT</code></p>';$('draw').onclick=()=>{let L=Number($('length').value),W=Number($('width').value),c=$('cadCanvas'),g=c.getContext('2d');g.clearRect(0,0,780,310);if(!(L>0&&W>0&&L<=1000&&W<=1000)){$('cadOutput').textContent=t.invalidSize;return}let sc=Math.min(550/L,205/W),w=L*sc,h=W*sc,x=(780-w)/2,y=(275-h)/2;g.fillStyle='#ecfaf6';g.fillRect(x,y,w,h);g.strokeStyle='#087e76';g.lineWidth=4;g.strokeRect(x,y,w,h);g.fillStyle='#193345';g.font='16px Arial';g.textAlign='center';g.fillText(L+' m',x+w/2,y+h+25);g.save();g.translate(x-20,y+h/2);g.rotate(-Math.PI/2);g.fillText(W+' m',0,0);g.restore();$('cadOutput').textContent=t.area+': '+(L*W).toFixed(2)+' m². '+t.cadNote};$('draw').click()}
else{$('labContent').innerHTML='<h3>'+t.ghgTitle+'</h3><p class="note">'+t.ghgIntro+'</p><div class="tablewrap"><table><tr><th>'+t.scope+'</th><th>'+t.source+'</th><th>'+t.activity+'</th><th>'+t.factor+'</th></tr>'+[t.fuel,t.electricity,t.freight].map((label,i)=>'<tr><td>Scope '+(i+1)+'</td><td>'+label+'</td><td><input id="a'+i+'" type="number" min="0" value="'+[1000,5000,2000][i]+'"></td><td><input id="ef'+i+'" type="number" min="0" step="any" placeholder="'+t.enter+'"></td></tr>').join('')+'</table></div><p><button class="primary" id="calculate">'+t.compute+'</button></p><div id="ghgResult"></div><p class="mut">'+t.ghgFormula+'</p>';$('calculate').onclick=()=>{let out=[];for(let i=0;i<3;i++){let av=$('a'+i).value,ev=$('ef'+i).value;if(av===''||ev===''){$('ghgResult').textContent=t.missingFactor;return}let a=Number(av),f=Number(ev);if(!Number.isFinite(a)||!Number.isFinite(f)||a<0||f<0){$('ghgResult').textContent=t.invalidFactors;return}out.push(a*f/1000)}$('ghgResult').innerHTML='<div class="cards">'+[...out.map((x,i)=>[x,'Scope '+(i+1)]),[out.reduce((a,b)=>a+b,0),t.ghgTotal]].map(([v,s])=>'<div class="card"><strong>'+v.toFixed(3)+'</strong>'+s+' · t CO₂e</div>').join('')+'</div>'}}
}
function exam(){const t=T();section(t.examTitle,'<p>'+t.examIntro+'</p>'+L().map((l,i)=>'<fieldset><legend><b>'+t.question+' '+(i+1)+'.</b> '+esc(l.q.prompt)+'</legend>'+l.q.options.map((v,j)=>'<label><input type="radio" name="exam'+i+'" value="'+j+'">'+esc(v)+'</label>').join('')+'<div id="e'+i+'"></div></fieldset>').join('')+'<p><button class="primary" id="submitExam">'+t.submit+'</button></p><h3 id="examResult"></h3>');$('submitExam').onclick=()=>{let n=0;L().forEach((l,i)=>{let r=document.querySelector('input[name="exam'+i+'"]:checked'),ok=r&&Number(r.value)===l.q.answer;if(ok)n++;$('e'+i).innerHTML='<p class="result">'+(ok?'✓ '+t.correct:'✗ '+t.incorrect)+' · '+t.answer+': <b>'+esc(l.q.options[l.q.answer])+'</b>. '+esc(l.q.why)+'</p>'});progress.lastExam=Number((n/15*10).toFixed(1));saved();$('examResult').textContent=t.examScore+': '+progress.lastExam+'/10 ('+n+'/15)'}}
function download(name,txt,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([txt],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1200)}
function showProgress(){const t=T(),done=L().filter(l=>progress.done[l.id]).length,keys=Object.keys(progress.scores);section(t.progressTitle,'<div class="cards">'+[[done+'/15',t.done],[keys.length,t.quizCount],[keys.length?(keys.reduce((s,k)=>s+Number(progress.scores[k]),0)/keys.length).toFixed(1)+'%':'—',t.avg],[progress.lastExam??'—',t.examLast]].map(([v,k])=>'<div class="card"><strong>'+v+'</strong>'+k+'</div>').join('')+'</div><h3>'+t.sessions+'</h3><div class="tablewrap"><table><tr><th>'+t.session+'</th><th>'+t.lesson+'</th><th>'+t.status+'</th><th>'+t.quickScore+'</th></tr>'+L().map(l=>'<tr><td>'+l.id+'</td><td>'+esc(l.title)+'</td><td>'+(progress.done[l.id]?t.complete:t.pending)+'</td><td>'+(progress.scores[l.id]===undefined?'—':progress.scores[l.id]+'%')+'</td></tr>').join('')+'</table></div><div class="row"><button id="export">'+t.export+'</button><button id="reset">'+t.reset+'</button></div><p>'+t.storage+'</p>');$('export').onclick=()=>download('DC3MO19_progress.json',JSON.stringify({course:'DC3MO19',language:lang,date:new Date().toISOString(),progress},null,2),'application/json');$('reset').onclick=()=>{if(confirm(t.resetAsk)){progress={done:{},scores:{}};saved();render()}}}
$('viBtn').onclick=()=>changeLang('vi');$('enBtn').onclick=()=>changeLang('en');render();
</script></body></html>
